$schema: './maintenance.schema.yaml'
schemaVersion: 1
version: '0.2.0'
tasks:
  -
    id: 'health-report'
    description: 'Record a compact developer tool and WSL health report.'
    enabled: true
    runAs: 'user'
    script: 'scripts/health-report.sh'
    timeoutSeconds: 120
    schedule:
      onBoot: true
      onCalendar: 'daily'
  -
    id: 'docker-cleaner'
    description: 'Prune unused Docker resources older than seven days.'
    enabled: false
    runAs: 'root'
    script: 'scripts/docker-cleaner.sh'
    timeoutSeconds: 1800
    schedule:
      onBoot: false
      onCalendar: 'Sun *-*-* 04:00:00'
