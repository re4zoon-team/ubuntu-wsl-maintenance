$schema: './maintenance.schema.yaml'
schemaVersion: 1
version: '0.5.0'
packages:
  -
    id: 'proxy-runtime'
    path: 'packages/proxy-runtime'
tasks:
  -
    id: 'proxy-installer-refresh'
    description: 'Refresh and enforce the required per-user proxy installation from the reviewed package.'
    enabled: true
    runAs: 'user'
    script: 'scripts/proxy-installer-refresh.sh'
    timeoutSeconds: 600
    schedule:
      onBoot: true
      onCalendar: 'daily'
  -
    id: 'health-report'
    description: 'Record a compact developer tool and WSL health report.'
    enabled: true
    runAs: 'user'
    script: 'scripts/health-report.sh'
    timeoutSeconds: 120
    schedule:
      onBoot: true
      onCalendar: 'daily'
  -
    id: 'docker-cleaner'
    description: 'Prune unused Docker resources older than seven days.'
    enabled: false
    runAs: 'root'
    script: 'scripts/docker-cleaner.sh'
    timeoutSeconds: 1800
    schedule:
      onBoot: false
      onCalendar: 'Sun *-*-* 04:00:00'
