$schema: './maintenance.schema.yaml'
schemaVersion: 1
version: '0.7.1'
packages:
  -
    id: 'proxy-runtime'
    version: '1.0.0'
    path: 'packages/proxy-runtime'
tasks:
  -
    id: 'proxy-installer-refresh'
    version: '1.1.0'
    mode: systemd
    dependsOn: ['proxy-runtime']
    description: 'Refresh and enforce the required per-user proxy installation from the reviewed package.'
    enabled: true
    runAs: 'user'
    script: 'scripts/proxy-refresh.py'
    timeoutSeconds: 600
    schedule:
      onBoot: true
      onCalendar: 'daily'
  -
    id: 'docker-cleaner'
    version: '1.1.0'
    mode: systemd
    dependsOn: []
    description: 'Prune unused Docker resources older than seven days.'
    enabled: false
    runAs: 'root'
    script: 'scripts/docker-cleaner.py'
    timeoutSeconds: 1800
    schedule:
      onBoot: false
      onCalendar: 'Sun *-*-* 04:00:00'
  -
    id: maintenance-desktop
    version: '1.0.0'
    mode: once
    description: Install the maintenance-delivered Windows desktop shortcut and custom icon.
    enabled: true
    runAs: user
    script: scripts/desktop-shortcut.py
    timeoutSeconds: 120
    files:
      - source: files/company-maintenance.ico
        target: ~/.local/share/company-dev/maintenance.ico
        chmod: '0644'
  -
    id: placeholder-cron
    version: '1.0.0'
    mode: cron
    description: Harmless end-to-end placeholder that replaces a per-user last-run record.
    enabled: true
    runAs: user
    script: scripts/placeholder-cron.py
    timeoutSeconds: 30
    cron: '* * * * *'
