$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://github.com/re4zoon-team/ubuntu-wsl-maintenance/maintenance.schema.yaml'
title: 'Company WSL maintenance release'
type: 'object'
additionalProperties: false
required:
  - 'schemaVersion'
  - 'version'
  - 'tasks'
properties:
  remove:
    type: 'object'
    additionalProperties: false
    properties:
      tasks:
        type: 'array'
        uniqueItems: true
        items:
          type: 'string'
          pattern: '^[a-z][a-z0-9-]{1,47}$'
      packages:
        type: 'array'
        uniqueItems: true
        items:
          type: 'string'
          pattern: '^[a-z][a-z0-9-]{1,47}$'
  $schema:
    type: 'string'
  schemaVersion:
    const: 1
  version:
    type: 'string'
    pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  packages:
    type: 'array'
    uniqueItems: true
    items:
      type: 'object'
      additionalProperties: false
      required:
        - 'id'
        - 'version'
        - 'path'
      properties:
        version:
          type: 'string'
          pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
        id:
          type: 'string'
          pattern: '^[a-z][a-z0-9-]{1,47}$'
        path:
          type: 'string'
          pattern: '^packages/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
  tasks:
    type: 'array'
    items:
      type: 'object'
      additionalProperties: false
      required:
        - 'id'
        - 'version'
        - 'description'
        - 'enabled'
        - 'runAs'
        - 'mode'
      allOf:
        - if:
            properties:
              mode: {const: files}
          then:
            required: [files]
            not:
              anyOf:
                - required: [script]
                - required: [timeoutSeconds]
          else:
            required: [script, timeoutSeconds]
        - if:
            properties:
              mode: {const: cron}
          then:
            required: [cron]
          else:
            not: {required: [cron]}
        - if:
            properties:
              mode: {const: systemd}
          then:
            required: [schedule]
          else:
            not:
              anyOf:
                - required: [schedule]
                - required: [serviceType]
      properties:
        mode:
          enum: [files, once, cron, systemd]
        serviceType:
          enum: [oneshot, simple]
        cron:
          type: string
          description: Five numeric cron fields; lists, ranges, and steps are supported.
          pattern: '^[0-9*,/-]+( +[0-9*,/-]+){4}$'
        files:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [source, target, chmod]
            properties:
              source:
                type: string
                pattern: '^files/[A-Za-z0-9._/-]+$'
              target:
                type: string
                description: Absolute path for root; ~/relative-path for the registered user.
                pattern: '^(/|~/)[A-Za-z0-9._/-]+$'
              chmod:
                type: string
                pattern: '^0[0-7]{3}$'
        version:
          type: 'string'
          pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
        dependsOn:
          type: 'array'
          uniqueItems: true
          items:
            type: 'string'
            pattern: '^[a-z][a-z0-9-]{1,47}$'
        id:
          type: 'string'
          pattern: '^[a-z][a-z0-9-]{1,47}$'
        description:
          type: 'string'
          maxLength: 160
        enabled:
          type: 'boolean'
        runAs:
          enum:
            - 'root'
            - 'user'
        script:
          type: 'string'
          pattern: '^scripts/[A-Za-z0-9._/-]+\.py$'
        timeoutSeconds:
          type: 'integer'
          minimum: 1
          maximum: 86400
        schedule:
          type: 'object'
          additionalProperties: false
          required:
            - 'onBoot'
          properties:
            onBoot:
              type: 'boolean'
            onCalendar:
              type:
                - 'string'
                - 'null'
              minLength: 1
              maxLength: 120
